name: Sync Wiki.js navigation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'nn/*.md'
      - 'nn/**/*.md'
      - 'en/*.md'
      - 'en/**/*.md'
      - '.github/workflows/sync-wiki-navigation.yml'

permissions:
  contents: read

jobs:
  sync-navigation:
    uses: vosshpk/wiki-infrastructure-v3/.github/workflows/sync-wiki-navigation.yml@main
    with:
      wiki_url: https://wiki.vosshpk.no
      wiki_site_id: c952bea9-40ec-4db1-a5c0-39286a665cf4
    secrets:
      WIKIJS_API_TOKEN: ${{ secrets.WIKIJS_API_TOKEN }}
      INFRA_REPO_READ_TOKEN: ${{ secrets.INFRA_REPO_READ_TOKEN }}
