<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1210" role="img" aria-labelledby="title description"><title id="title">Organisation chart · UML class diagram</title><desc id="description">Organisation chart for Voss Hang- and Paraglider Club, reproduced as a UML class diagram.</desc><style>.bg{fill:#f7f9fc}.line{fill:none;stroke:#425c82;stroke-width:3}.box{fill:#fff;stroke:#425c82;stroke-width:2.5;rx:8}.primary{fill:#d9e5f3}.group{fill:#e7edf5}.st{font:14px Arial,sans-serif;fill:#52647d;text-anchor:middle}.tx{font:18px Arial,sans-serif;fill:#17263b;text-anchor:middle}.small{font:14px Arial,sans-serif;fill:#273c59;text-anchor:middle}.head{font:700 30px Arial,sans-serif;fill:#314763;text-anchor:middle}.grouphead{font:700 18px Arial,sans-serif;fill:#314763}</style><rect class="bg" width="2000" height="1210"/><text class="head" x="1000" y="44">Organisation chart · UML class diagram</text><g class="line"><path d="M1000 160V195H445V230M1000 195H1460V230"/><path d="M445 315V390M1460 315V390M1460 475V550"/><path d="M1460 635V675H960V710M1460 675H1570V710"/><path d="M445 475V520H180V560M445 520H480V560M180 650V680M480 650V680M445 475V770H320V800"/><path d="M960 810V860H640V900M960 860H860V900M960 860H1080V900M960 810V1040H800V1080M960 1040H1040V1080"/><path d="M1570 810V860H1290V900M1570 860H1490V900M1570 860H1690V900M1570 860H1890V900M1490 985V1080"/></g><g><rect class="box primary" x="860" y="72" width="280" height="88"/><text class="st" x="1000" y="95">«organisation body»</text><text class="tx" x="1000" y="120">Section</text></g><g><rect class="box primary" x="300" y="230" width="290" height="85"/><text class="st" x="445" y="253">«role»</text><text class="tx" x="445" y="278">Technical lead</text></g><g><rect class="box primary" x="1320" y="230" width="280" height="85"/><text class="st" x="1460" y="253">«organisation body»</text><text class="tx" x="1460" y="278">AGM</text></g><g><rect class="box group" x="300" y="390" width="290" height="85"/><text class="st" x="445" y="413">«group»</text><text class="tx" x="445" y="438">Safety group</text></g><g><rect class="box primary" x="1320" y="390" width="280" height="85"/><text class="st" x="1460" y="413">«organisation body»</text><text class="tx" x="1460" y="438">Board</text></g><g><rect class="box primary" x="1320" y="550" width="280" height="85"/><text class="st" x="1460" y="573">«role»</text><text class="tx" x="1460" y="598">Managing director</text></g><g><rect class="box box" x="35" y="560" width="290" height="90"/><text class="st" x="180" y="583">«role»</text><text class="tx" x="180" y="608">Training officer</text><text class="small" x="180" y="630">and rules</text></g><g><rect class="box box" x="350" y="560" width="260" height="90"/><text class="st" x="480" y="583">«role»</text><text class="tx" x="480" y="608">Tandem officer</text></g><g><rect class="box box" x="35" y="680" width="290" height="90"/><text class="st" x="180" y="703">«role»</text><text class="tx" x="180" y="728">Equipment officer</text></g><g><rect class="box box" x="350" y="680" width="260" height="90"/><text class="st" x="480" y="703">«role»</text><text class="tx" x="480" y="728">Safety officer</text><text class="small" x="480" y="750">May be an employee.</text></g><g><rect class="box box" x="190" y="800" width="260" height="90"/><text class="st" x="320" y="823">«role»</text><text class="tx" x="320" y="848">Secretary</text><text class="small" x="320" y="870">May be an employee.</text></g><g><rect class="box primary" x="780" y="710" width="360" height="100"/><text class="st" x="960" y="733">«role»</text><text class="tx" x="960" y="758">Operations manager</text><text class="small" x="960" y="780">and course coordinator</text></g><g><rect class="box primary" x="1380" y="710" width="380" height="100"/><text class="st" x="1570" y="733">«function»</text><text class="tx" x="1570" y="758">Administration and</text><text class="small" x="1570" y="780">member services</text></g><g><rect class="box box" x="545" y="900" width="190" height="85"/><text class="st" x="640" y="923">«responsibility»</text><text class="tx" x="640" y="948">Environment</text></g><g><rect class="box box" x="765" y="900" width="190" height="85"/><text class="st" x="860" y="923">«responsibility»</text><text class="tx" x="860" y="948">Police certificates</text></g><g><rect class="box box" x="985" y="900" width="190" height="85"/><text class="st" x="1080" y="923">«responsibility»</text><text class="tx" x="1080" y="948">Equipment</text></g><g><rect class="box box" x="680" y="1080" width="240" height="85"/><text class="st" x="800" y="1103">«role»</text><text class="tx" x="800" y="1128">Course instructors</text></g><g><rect class="box box" x="920" y="1080" width="240" height="85"/><text class="st" x="1040" y="1103">«role»</text><text class="tx" x="1040" y="1128">Tandem instructors</text></g><g><rect class="box box" x="1200" y="900" width="180" height="85"/><text class="st" x="1290" y="923">«function»</text><text class="tx" x="1290" y="948">Website/shop</text></g><g><rect class="box box" x="1400" y="900" width="180" height="85"/><text class="st" x="1490" y="923">«function»</text><text class="tx" x="1490" y="948">Facilities</text></g><g><rect class="box box" x="1600" y="900" width="180" height="85"/><text class="st" x="1690" y="923">«function»</text><text class="tx" x="1690" y="948">Finance</text></g><g><rect class="box box" x="1800" y="900" width="180" height="85"/><text class="st" x="1890" y="923">«function»</text><text class="tx" x="1890" y="948">Events</text></g><g><rect class="box box" x="1350" y="1080" width="280" height="85"/><text class="st" x="1490" y="1103">«function»</text><text class="tx" x="1490" y="1128">Cleaning and</text><text class="small" x="1490" y="1150">maintenance</text></g></svg>
