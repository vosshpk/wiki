<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1740" role="img" aria-labelledby="title description"><title id="title">Strategy summary · UML class diagram</title><desc id="description">Strategy summary from the presentation, reproduced as a UML class diagram.</desc><style>.bg{fill:#f7f9fc}.line{fill:none;stroke:#425c82;stroke-width:3}.box{fill:#fff;stroke:#425c82;stroke-width:2.5;rx:8}.primary{fill:#d9e5f3}.group{fill:#e7edf5}.st{font:14px Arial,sans-serif;fill:#52647d;text-anchor:middle}.tx{font:18px Arial,sans-serif;fill:#17263b;text-anchor:middle}.small{font:14px Arial,sans-serif;fill:#273c59;text-anchor:middle}.head{font:700 30px Arial,sans-serif;fill:#314763;text-anchor:middle}.grouphead{font:700 18px Arial,sans-serif;fill:#314763}</style><rect class="bg" width="1400" height="1740"/><text class="head" x="700" y="48">Strategy summary · UML class diagram</text><g class="line"><path d="M700 300V330H265V355M700 330H700V355M700 330H1135V355"/><path d="M700 930L390 985M700 930L1010 985M390 1050H1010"/><path d="M390 1285H1010M390 1285L700 1410M1010 1285L700 1410"/></g><g><rect class="box primary" x="100" y="90" width="1200" height="95"/><text class="st" x="700" y="113">«strategi»</text><text class="tx" x="700" y="138">Concept: Engaging experiences with air sports</text></g><g><rect class="box primary" x="100" y="215" width="1200" height="95"/><text class="st" x="700" y="238">«strategi»</text><text class="tx" x="700" y="263">Evidence: A sense of ownership and belonging</text></g><g><rect class="box box" x="95" y="355" width="340" height="95"/><text class="st" x="265" y="378">«evidence»</text><text class="tx" x="265" y="403">Well-functioning facilities</text></g><g><rect class="box box" x="530" y="355" width="340" height="95"/><text class="st" x="700" y="378">«evidence»</text><text class="tx" x="700" y="403">A healthy culture</text></g><g><rect class="box box" x="965" y="355" width="340" height="95"/><text class="st" x="1135" y="378">«evidence»</text><text class="tx" x="1135" y="403">Good courses and follow-up</text></g><g><rect class="box primary" x="100" y="485" width="1200" height="90"/><text class="st" x="700" y="508">«strategi»</text><text class="tx" x="700" y="533">Promise: Active and satisfied pilots</text></g><g><rect class="box primary" x="100" y="605" width="1200" height="110"/><text class="st" x="700" y="628">«strategi»</text><text class="tx" x="700" y="653">Position:</text><text class="tx" x="700" y="675">A well-resourced club that drives the</text><text class="small" x="700" y="697">development of adventure sports.</text></g><g><rect class="box primary" x="100" y="740" width="1200" height="110"/><text class="st" x="700" y="763">«strategi»</text><text class="tx" x="700" y="788">Target group:</text><text class="tx" x="700" y="810">Members who want to enjoy themselves in a flying</text><text class="small" x="700" y="832">community in Voss!</text></g><rect class="box group" x="80" y="875" width="1240" height="265"/><text class="grouphead" x="110" y="908">«pakke» Communication:</text><g><rect class="box box" x="530" y="925" width="340" height="68"/><text class="st" x="700" y="948">«characteristic»</text><text class="tx" x="700" y="973">Considerate</text></g><g><rect class="box box" x="205" y="985" width="250" height="68"/><text class="st" x="330" y="1008">«characteristic»</text><text class="tx" x="330" y="1033">Unifying</text></g><g><rect class="box box" x="945" y="985" width="250" height="68"/><text class="st" x="1070" y="1008">«characteristic»</text><text class="tx" x="1070" y="1033">Curious</text></g><g><rect class="box primary" x="530" y="1028" width="340" height="72"/><text class="st" x="700" y="1051">«klubbmedlem»</text><text class="tx" x="700" y="1076">A playful bringer of joy</text></g><rect class="box group" x="80" y="1160" width="1240" height="300"/><text class="grouphead" x="110" y="1193">«pakke» Organisation:</text><g><rect class="box box" x="205" y="1220" width="250" height="68"/><text class="st" x="330" y="1243">«value»</text><text class="tx" x="330" y="1268">Inclusion</text></g><g><rect class="box box" x="945" y="1220" width="250" height="68"/><text class="st" x="1070" y="1243">«value»</text><text class="tx" x="1070" y="1268">Development</text></g><g><rect class="box primary" x="530" y="1300" width="340" height="68"/><text class="st" x="700" y="1323">«resultat»</text><text class="tx" x="700" y="1348">Exciting opportunities</text></g><g><rect class="box primary" x="590" y="1380" width="220" height="58"/><text class="st" x="700" y="1403">«value»</text><text class="tx" x="700" y="1428">Safety</text></g><g><rect class="box primary" x="100" y="1480" width="1200" height="100"/><text class="st" x="700" y="1503">«strategi»</text><text class="tx" x="700" y="1528">Mission:</text><text class="tx" x="700" y="1550">Facilitate good experiences in the air</text><text class="small" x="700" y="1572">and among people.</text></g><g><rect class="box primary" x="100" y="1605" width="1200" height="95"/><text class="st" x="700" y="1628">«strategi»</text><text class="tx" x="700" y="1653">Vision: Create safe and genuine joy in flying!</text></g></svg>
